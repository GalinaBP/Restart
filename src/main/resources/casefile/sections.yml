# Data-collection sections for a personal bankruptcy case (backlog AI-002).
#
# This file is the field ↔ statutory-basis mapping config the backlog requires: every section
# carries the 127-ФЗ reference it originates from, so a legislative amendment means editing this
# file (and the templates), not the workflow engine.
#
# ############################################################################################
# ##  ПЛЕЙСХОЛДЕР ДО ПРОВЕРКИ ЮРИСТОМ. Список секций, состав полей и ссылки на нормы         ##
# ##  127-ФЗ (ред., действующая с 21.06.2026) требуют подтверждения юристом до релиза.       ##
# ############################################################################################
#
# Structure:
#   key            — stable machine key, must match SectionKey enum
#   order          — position in the step-by-step journey (one section per screen)
#   repeatable     — true: payload is an array of entry objects; false: payload is one object
#   statutoryBasis — the 127-ФЗ provision this section traces back to (placeholder wording)
#   fields         — allowed field names of the section (or of one entry, when repeatable)

sections:
  - key: PERSONAL_DETAILS
    order: 1
    repeatable: false
    statutoryBasis: "ст. 213.4 127-ФЗ — сведения о гражданине (ПЛЕЙСХОЛДЕР, уточнить у юриста)"
    fields: [lastName, firstName, middleName, birthDate, birthPlace, inn, snils]

  - key: PASSPORT
    order: 2
    repeatable: false
    statutoryBasis: "ст. 213.4 127-ФЗ — документ, удостоверяющий личность (ПЛЕЙСХОЛДЕР)"
    fields: [series, number, issuedBy, issueDate, departmentCode]

  - key: REGISTRATION_ADDRESS
    order: 3
    repeatable: false
    statutoryBasis: "ст. 213.4 127-ФЗ — место жительства (ПЛЕЙСХОЛДЕР)"
    fields: [region, city, street, house, apartment, postalCode]

  - key: CONTACT_INFO
    order: 4
    repeatable: false
    statutoryBasis: "требование суда к заявлению — контактные данные (ПЛЕЙСХОЛДЕР)"
    fields: [phone, email]

  - key: EMPLOYMENT
    order: 5
    repeatable: false
    statutoryBasis: "ст. 213.4 127-ФЗ — сведения о занятости (ПЛЕЙСХОЛДЕР)"
    fields: [status, employerName, position]

  - key: MONTHLY_INCOME
    order: 6
    repeatable: false
    statutoryBasis: "ст. 213.4 127-ФЗ — сведения о доходах (ПЛЕЙСХОЛДЕР)"
    fields: [amount, source]

  - key: MARITAL_STATUS
    order: 7
    repeatable: false
    statutoryBasis: "ст. 213.4, 213.25 127-ФЗ — семейное положение (ПЛЕЙСХОЛДЕР)"
    fields: [status, hasMarriageContract]

  - key: DEPENDENTS
    order: 8
    repeatable: true
    statutoryBasis: "ст. 213.4 127-ФЗ — иждивенцы (ПЛЕЙСХОЛДЕР)"
    fields: [fullName, birthDate, relation]

  - key: CREDITORS
    order: 9
    repeatable: true
    statutoryBasis: "ст. 213.4 127-ФЗ — список кредиторов (форма утв. Минэкономразвития; ПЛЕЙСХОЛДЕР)"
    fields: [name, inn, address, debtAmount, debtType]

  - key: DEBTS
    order: 10
    repeatable: true
    statutoryBasis: "ст. 213.4 127-ФЗ — сведения о задолженности (ПЛЕЙСХОЛДЕР)"
    fields: [creditorName, amount, overdueSinceDate, type]

  - key: BANK_ACCOUNTS
    order: 11
    repeatable: true
    statutoryBasis: "ст. 213.4 127-ФЗ — счета в банках (ПЛЕЙСХОЛДЕР)"
    fields: [bankName, accountNumber, balance]

  - key: PROPERTY
    order: 12
    repeatable: true
    statutoryBasis: "ст. 213.4 127-ФЗ — опись имущества (форма утв. Минэкономразвития; ПЛЕЙСХОЛДЕР)"
    fields: [description, estimatedValue]

  - key: REAL_ESTATE
    order: 13
    repeatable: true
    statutoryBasis: "ст. 213.4 127-ФЗ — недвижимое имущество (ПЛЕЙСХОЛДЕР)"
    fields: [type, address, area, ownershipShare]

  - key: VEHICLES
    order: 14
    repeatable: true
    statutoryBasis: "ст. 213.4 127-ФЗ — транспортные средства (ПЛЕЙСХОЛДЕР)"
    fields: [type, brand, model, year, regNumber]

  - key: COURT_PROCEEDINGS
    order: 15
    repeatable: true
    statutoryBasis: "ст. 213.4 127-ФЗ — судебные производства (ПЛЕЙСХОЛДЕР)"
    fields: [courtName, caseNumber, subject, status]

  - key: ENFORCEMENT_PROCEEDINGS
    order: 16
    repeatable: true
    statutoryBasis: "ст. 69.1 229-ФЗ, ст. 213.4 127-ФЗ — исполнительные производства (ПЛЕЙСХОЛДЕР)"
    fields: [bailiffDepartment, proceedingNumber, subject, amount]
