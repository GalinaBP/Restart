# Production profile. Every secret and connection detail MUST come from the environment; there are
# no defaults here on purpose, so a misconfigured deployment fails fast instead of using weak values.

# PaaS platforms (Railway, Heroku, …) tell the app which port to listen on via PORT.
server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      access-secret: ${JWT_ACCESS_SECRET}
      refresh-secret: ${JWT_REFRESH_SECRET}

# Seed data must never run in production. Registration can be closed for the private-beta phase
# (REGISTRATION_ENABLED=false): existing logins keep working, sign-ups get a plain 403.
restart:
  seed:
    enabled: false
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
  reset:
    # Where mailed password-reset links point; when unset the first CORS origin (= the frontend
    # domain) is used, so no extra variable is needed on Railway. Real email delivery switches on
    # by setting SPRING_MAIL_HOST/PORT/USERNAME/PASSWORD (+ MAIL_FROM); without SMTP the reset
    # link is written to the backend log instead — see docs/deploy-railway.md.
    link-base-url: ${FRONTEND_BASE_URL:}

# API documentation is disabled in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    ru.restart.app: INFO
