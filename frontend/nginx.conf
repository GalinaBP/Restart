# Rendered by the nginx image's template mechanism (envsubst substitutes ONLY defined env vars,
# so nginx's own $uri below is untouched). BASIC_AUTH_REALM defaults to the literal `off` in the
# Dockerfile — no auth; set it to a single word (e.g. Restart) plus BASIC_AUTH_USERS (htpasswd
# line(s)) on the deployment to lock the whole site behind a browser login. That is the
# private-beta gate: flip two env vars, no rebuild.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic ${BASIC_AUTH_REALM};
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Unauthenticated healthcheck endpoint for Railway. Basic auth is disabled here
    # so the platform probe (which sends no credentials) can receive a 200 while the
    # private-beta gate still protects every real route.
    location = /healthz {
        auth_basic off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # No /api proxy here: the SPA calls the backend directly at the absolute URL
    # baked in via the VITE_API_BASE build arg (see Dockerfile), and the backend
    # allows the frontend origin through CORS_ALLOWED_ORIGINS. A proxy upstream
    # would need a resolvable backend hostname at nginx startup, which differs
    # per environment (compose network vs. Railway) and crashes nginx when absent.

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
