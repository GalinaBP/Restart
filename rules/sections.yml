# Data-collection sections for a personal bankruptcy case (backlog AI-002 + AI-003).
#
# This file is the field ↔ statutory-basis mapping config the backlog requires, and — since
# AI-003 — also the validation rulebook: field types, required flags, mandatory sections, and
# duplicate detection are all defined here, so a legislative amendment means editing this file
# (and the templates), not the workflow or validation engine.
#
# ############################################################################################
# ##  ПЛЕЙСХОЛДЕР ДО ПРОВЕРКИ ЮРИСТОМ. Список секций, состав полей, обязательность и ссылки  ##
# ##  на нормы 127-ФЗ (ред., действующая с 21.06.2026) требуют подтверждения юристом.        ##
# ############################################################################################
#
# Structure:
#   key            — stable machine key; permanent, because it indexes the answers already saved
#                    in a user's browser — adding a section is safe, renaming one is not
#   order          — position in the step-by-step journey (one section per screen)
#   repeatable     — true: payload is an array of entry objects; false: payload is one object
#   mandatory      — true: an empty/absent section blocks document generation (AI-003/AI-007)
#   statutoryBasis — the 127-ФЗ provision this section traces back to (placeholder wording)
#   uniqueBy       — repeatable only: entries with equal values of these fields are duplicates
#   fields         — the section's fields (of one entry, when repeatable):
#     name           — field key as submitted by the client
#     type           — STRING | BOOLEAN | INTEGER | MONEY | DATE |
#                      PASSPORT_SERIES | PASSPORT_NUMBER | INN  (validated deterministically)
#     required       — true: must be present and non-blank for the section to be complete

sections:
  - key: PERSONAL_DETAILS
    order: 1
    repeatable: false
    mandatory: true
    statutoryBasis: "ст. 213.4 127-ФЗ — сведения о гражданине (ПЛЕЙСХОЛДЕР, уточнить у юриста)"
    fields:
      - { name: lastName,   type: STRING, required: true }
      - { name: firstName,  type: STRING, required: true }
      - { name: middleName, type: STRING, required: false }
      - { name: birthDate,  type: DATE,   required: true }
      - { name: birthPlace, type: STRING, required: true }
      - { name: inn,        type: INN,    required: false }
      - { name: snils,      type: STRING, required: false }

  - key: PASSPORT
    order: 2
    repeatable: false
    mandatory: true
    statutoryBasis: "ст. 213.4 127-ФЗ — документ, удостоверяющий личность (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: series,         type: PASSPORT_SERIES, required: true }
      - { name: number,         type: PASSPORT_NUMBER, required: true }
      - { name: issuedBy,       type: STRING,          required: true }
      - { name: issueDate,      type: DATE,            required: true }
      - { name: departmentCode, type: STRING,          required: false }

  - key: REGISTRATION_ADDRESS
    order: 3
    repeatable: false
    mandatory: true
    statutoryBasis: "ст. 213.4 127-ФЗ — место жительства (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: region,     type: STRING, required: true }
      - { name: city,       type: STRING, required: true }
      - { name: street,     type: STRING, required: true }
      - { name: house,      type: STRING, required: true }
      - { name: apartment,  type: STRING, required: false }
      - { name: postalCode, type: STRING, required: false }

  - key: CONTACT_INFO
    order: 4
    repeatable: false
    mandatory: true
    statutoryBasis: "требование суда к заявлению — контактные данные (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: phone, type: STRING, required: true }
      - { name: email, type: STRING, required: false }

  - key: EMPLOYMENT
    order: 5
    repeatable: false
    mandatory: true
    statutoryBasis: "ст. 213.4 127-ФЗ — сведения о занятости (ПЛЕЙСХОЛДЕР)"
    fields:
      # ПЛЕЙСХОЛДЕР: перечень занятости и видов дохода — на проверке юриста.
      - name: status
        type: STRING
        required: true
        options: [EMPLOYED, NOT_WORKING]
      - name: otherIncome
        type: STRING
        required: true
        options: [SELF_EMPLOYED, PENSION, BENEFITS, NONE, OTHER]
      - { name: employerName, type: STRING, required: false }
      - { name: position,     type: STRING, required: false }

  - key: MONTHLY_INCOME
    order: 6
    repeatable: false
    mandatory: true
    statutoryBasis: "ст. 213.4 127-ФЗ — сведения о доходах (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: amount, type: MONEY,  required: true }
      - { name: source, type: STRING, required: true }

  # Income beyond the main one (аренда, подработка, алименты…). Optional and repeatable, because
  # a debtor may have several such sources or none; the main income stays in MONTHLY_INCOME.
  - key: OTHER_INCOME
    order: 7
    repeatable: true
    mandatory: false
    statutoryBasis: "ст. 213.4 127-ФЗ — иные источники дохода (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: source, type: STRING, required: true }
      - { name: amount, type: MONEY,  required: true }

  # hasMarriageContract deliberately absent: the ICP is unmarried debtors, and a marriage
  # contract signals a case this app must not handle on its own (routed to a lawyer instead).
  - key: MARITAL_STATUS
    order: 8
    repeatable: false
    mandatory: true
    statutoryBasis: "ст. 213.4, 213.25 127-ФЗ — семейное положение (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: status, type: STRING, required: true }

  - key: DEPENDENTS
    order: 9
    repeatable: true
    mandatory: false
    statutoryBasis: "ст. 213.4 127-ФЗ — иждивенцы (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: fullName,  type: STRING, required: true }
      - { name: birthDate, type: DATE,   required: true }
      - { name: relation,  type: STRING, required: true }

  # One entry per debt: who is owed, how much, and since when it stopped being paid. Formerly two
  # separate steps (CREDITORS + DEBTS) that asked for the same facts twice — merged so the debtor
  # names each creditor once. `uniqueBy` still catches the same creditor entered twice.
  - key: CREDITORS
    order: 10
    repeatable: true
    mandatory: true
    statutoryBasis: "ст. 213.4 127-ФЗ — список кредиторов и размер задолженности (форма утв. Минэкономразвития; ПЛЕЙСХОЛДЕР)"
    uniqueBy: [name, inn]
    fields:
      - { name: name,             type: STRING, required: true }
      - { name: inn,              type: INN,    required: false }
      - { name: address,          type: STRING, required: true }
      - { name: debtAmount,       type: MONEY,  required: true }
      - { name: debtType,         type: STRING, required: false }
      - { name: overdueSinceDate, type: DATE,   required: false }

  - key: BANK_ACCOUNTS
    order: 11
    repeatable: true
    mandatory: false
    statutoryBasis: "ст. 213.4 127-ФЗ — счета в банках (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: bankName,      type: STRING, required: true }
      - { name: accountNumber, type: STRING, required: true }
      - { name: balance,       type: MONEY,  required: false }

  - key: REAL_ESTATE
    order: 12
    repeatable: true
    mandatory: false
    statutoryBasis: "ст. 213.4 127-ФЗ — недвижимое имущество (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: type,           type: STRING, required: true }
      - { name: address,        type: STRING, required: true }
      - { name: area,           type: MONEY,  required: false }
      - { name: ownershipShare, type: STRING, required: false }

  - key: VEHICLES
    order: 13
    repeatable: true
    mandatory: false
    statutoryBasis: "ст. 213.4 127-ФЗ — транспортные средства (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: type,      type: STRING,  required: true }
      - { name: brand,     type: STRING,  required: false }
      - { name: model,     type: STRING,  required: false }
      - { name: year,      type: INTEGER, required: false }
      - { name: regNumber, type: STRING,  required: false }

  # The application must name the СРО from whose members the financial manager is approved
  # (backlog AI-020). Mandatory, so an unnamed СРО blocks document generation exactly like any
  # other missing required fact.
  #
  # ##  ПЛЕЙСХОЛДЕР: сам механизм (выбирает должник или суд назначает СРО случайным образом),
  # ##  обязательный состав сведений и необходимость отдельного ходатайства — вопросы юристу,
  # ##  см. docs/lawyer-review.md, раздел 2а.
  # Proof that the duty and the deposit were paid (backlog AI-021). Optional on purpose: the
  # documents are prepared BEFORE paying, so a missing payment must not block generation — it
  # only holds up filing. The journey's FEES_AND_DEPOSIT stage reads its status from this
  # section, which is why nothing else records payment state.
  - key: PAYMENTS
    order: 17
    repeatable: false
    mandatory: false
    statutoryBasis: "ст. 213.4 127-ФЗ, ст. 333.21 НК РФ — уплата госпошлины и внесение депозита (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: stateDutyPaidOn,     type: DATE,   required: false }
      - { name: stateDutyReference,  type: STRING, required: false }
      - { name: depositPaidOn,       type: DATE,   required: false }
      - { name: depositReference,    type: STRING, required: false }

  - key: MANAGER_SRO
    order: 16
    repeatable: false
    mandatory: true
    statutoryBasis: "ст. 213.4, 213.9 127-ФЗ — саморегулируемая организация, из числа членов которой утверждается финансовый управляющий (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: name,           type: STRING, required: true }
      - { name: address,        type: STRING, required: true }
      - { name: inn,            type: INN,    required: false }
      - { name: ogrn,           type: STRING, required: false }
      - { name: registryNumber, type: STRING, required: false }

  # Record that the completed package was actually handed to the court (backlog AI-022).
  # Optional on purpose: the package can be prepared, and even paid for, well before it is
  # submitted, so a missing submission must not block anything upstream — it only holds up the
  # FILING stage. The journey's FILING stage reads its status from this section, which is why
  # nothing else records submission state.
  - key: FILING_SUBMISSION
    order: 18
    repeatable: false
    mandatory: false
    statutoryBasis: "ст. 213.4 127-ФЗ — подача заявления (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: submissionDate,  type: DATE,   required: false }
      - { name: courtName,       type: STRING, required: false }
      - { name: referenceNumber, type: STRING, required: false }

  # Court-case tracking (backlog AI-023): the case number the court assigns, the date it accepted
  # the application for consideration, and what it ultimately decided. Optional and blocks nothing
  # — the COURT_DECISION stage stays user-recorded (status/dates/note), this section is
  # supplementary tracking data the stage links to, not something it derives its status from.
  - key: COURT_CASE
    order: 19
    repeatable: false
    mandatory: false
    statutoryBasis: "ст. 213.6 127-ФЗ — рассмотрение дела судом (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: caseNumber,    type: STRING, required: false }
      - { name: admissionDate, type: DATE,   required: false }
      - { name: decision,      type: STRING, required: false }

  # One entry per court hearing — a case can be rescheduled or heard several times over the months
  # a procedure takes (backlog AI-023). Optional and repeatable for the same reason as COURT_CASE:
  # nothing here is required, and nothing upstream depends on it.
  - key: COURT_HEARINGS
    order: 20
    repeatable: true
    mandatory: false
    statutoryBasis: "ст. 213.6 127-ФЗ — рассмотрение дела судом (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: date,    type: DATE,   required: false }
      - { name: subject, type: STRING, required: false }
      - { name: outcome, type: STRING, required: false }

  # Publication of the bankruptcy notice in the public register (ЕФРСБ) the claim-filing deadline
  # runs from (backlog AI-025). Optional tracking data that blocks nothing — the CREDITOR_CLAIMS
  # stage stays user-recorded; this section only feeds the deadline calculation exposed at
  # GET /cases/{id}/claim-deadline (the period itself lives in claim-deadline.yml).
  - key: EFRSB_PUBLICATION
    order: 21
    repeatable: false
    mandatory: false
    statutoryBasis: "ст. 213.7 127-ФЗ — включение сведений в Единый федеральный реестр сведений о банкротстве (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: publicationDate, type: DATE,   required: false }
      - { name: messageNumber,   type: STRING, required: false }   # номер сообщения в ЕФРСБ

  # Claims creditors have filed WITH THE COURT during the procedure (backlog AI-025) — NOT the
  # same thing as CREDITORS above (the debtor's own list of who is owed, collected for the
  # application). Optional and repeatable and blocks nothing: a debtor may see none, one, or many
  # such claims, and may dispute any of them.
  - key: FILED_CLAIMS
    order: 22
    repeatable: true
    mandatory: false
    statutoryBasis: "ст. 213.8 127-ФЗ — предъявление требований кредиторами и включение в реестр требований (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: creditorName, type: STRING,  required: false }
      - { name: amount,       type: MONEY,   required: false }
      - { name: filedOn,      type: DATE,    required: false }
      - { name: disputed,     type: BOOLEAN, required: false }   # должник оспаривает это требование

  # A personal log of reports and correspondence received from the arbitration manager — a
  # record-keeping convenience, not a messaging channel. Optional and repeatable, blocks nothing.
  - key: MANAGER_CORRESPONDENCE
    order: 23
    repeatable: true
    mandatory: false
    statutoryBasis: "справочный журнал переписки с финансовым управляющим (ПЛЕЙСХОЛДЕР)"
    fields:
      - { name: date, type: DATE,   required: false }
      - { name: type, type: STRING, required: false }
      - { name: note, type: STRING, required: false }
