# What the filing costs (backlog AI-021): the state duty and the deposit for the financial
# manager's remuneration. Amounts live here and nowhere else — changing what a filing costs is an
# edit to this file, never a code change, exactly like a template edition bump in AI-005.
#
# ##############################################################################################
# ##  !!! ЦИФРЫ НИЖЕ — ПЛЕЙСХОЛДЕР И НЕ ПОДТВЕРЖДЕНЫ ЮРИСТОМ !!!                              ##
# ##                                                                                          ##
# ##  Это единственное место в продукте, где неверное значение стоит пользователю реальных    ##
# ##  денег и может привести к оставлению заявления без движения. До проверки юристом суммы   ##
# ##  показываются пользователю ТОЛЬКО с пометкой «черновик, проверьте на сайте суда».        ##
# ##  Вопросы юристу — docs/lawyer-review.md, раздел 4а.                                      ##
# ##############################################################################################
#
# effectiveFrom — с какой даты действуют суммы (для истории правок; на расчёт не влияет).
# Каждая позиция:
#   key            — стабильный ключ, по которому интерфейс находит позицию (переименовывать нельзя)
#   amount         — сумма в рублях, ОБЯЗАТЕЛЬНО В КАВЫЧКАХ: без них YAML разберёт её как
#                    double, и «25000.00» превратится в 25000.0. Приложение такое отвергает.
#   statutoryBasis — норма, из которой берётся сумма (ПЛЕЙСХОЛДЕР)
#   confirmed      — false, пока юрист не подтвердил сумму. Пока хоть одна позиция false,
#                    интерфейс и документ показывают предупреждение.

effectiveFrom: "2026-06-21"

items:
  - key: STATE_DUTY
    amount: "300.00"
    confirmed: false
    statutoryBasis: "пп. 5 п. 1 ст. 333.21 НК РФ — госпошлина по заявлению гражданина о признании банкротом (ПЛЕЙСХОЛДЕР, требует подтверждения)"

  - key: MANAGER_DEPOSIT
    amount: "25000.00"
    confirmed: false
    statutoryBasis: "п. 4 ст. 213.4, ст. 20.6 127-ФЗ — единовременное вознаграждение финансового управляющего, вносится на депозит суда (ПЛЕЙСХОЛДЕР, требует подтверждения)"
